name: Marketing AI Daily

# 자동 스케줄 비활성화 — 필요할 때 Actions 탭에서 수동 실행한다.
on:
  workflow_dispatch:
    inputs:
      skip_ig:
        description: 'Skip Instagram pipeline'
        type: boolean
        default: false
      publish:
        description: 'Publish IG when Meta secrets exist'
        type: boolean
        default: false

jobs:
  marketing-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run marketing daily agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SNS_CAMPAIGN_START: ${{ secrets.SNS_CAMPAIGN_START }}
          SNS_AUTO_PUBLISH: ${{ github.event.inputs.publish == 'true' && 'true' || secrets.SNS_AUTO_PUBLISH }}
          SNS_SKIP_IMAGES: ${{ secrets.SNS_SKIP_IMAGES }}
          SNS_USE_MANUAL_IMAGES: ${{ secrets.SNS_USE_MANUAL_IMAGES }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_SUA_USER_ID: ${{ secrets.INSTAGRAM_SUA_USER_ID }}
          INSTAGRAM_ETHAN_USER_ID: ${{ secrets.INSTAGRAM_ETHAN_USER_ID }}
          SNS_IMAGE_BASE_URL: ${{ secrets.SNS_IMAGE_BASE_URL }}
          SNS_PUBLISH_DRY_RUN: ${{ github.event.inputs.publish == 'true' && 'false' || 'true' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_ig }}" = "true" ]; then ARGS="$ARGS --skip-ig"; fi
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          node scripts/marketing-agent/run-daily.mjs $ARGS

      - name: Upload marketing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-out-${{ github.run_id }}
          path: scripts/out/marketing/
          if-no-files-found: ignore
